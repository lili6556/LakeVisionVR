     frente pra quem está olhando — bem menor que antes -->

<a-entity id="plantacao"></a-entity>

<script>

const plantacao = document.querySelector("#plantacao");

const tonsTalo = ["#5d8b32", "#6b9a3c", "#548029"];
const tonsFolha = ["#6ea83f", "#7fbd4a", "#63a038"];

for(let z=-80;z<80;z+=3){

    for(let x=-18;x<18;x+=3){

        if(Math.abs(x)<4) continue;

        const milho=document.createElement("a-entity");

        milho.setAttribute("position",
        `${x+(Math.random()*0.5)} 0 ${z}`);

        const altura = 1.0 + Math.random()*0.45;
        const folhaAltura = 0.8 + Math.random()*0.35;
        const corTalo = tonsTalo[Math.floor(Math.random()*tonsTalo.length)];
        const corFolha = tonsFolha[Math.floor(Math.random()*tonsFolha.length)];

        milho.innerHTML=`

        <a-cylinder
        radius="0.02"
        height="${altura}"
        color="${corTalo}"
        position="0 ${(altura/2).toFixed(2)} 0">
        </a-cylinder>

        <a-plane
        width="0.28"
        height="${folhaAltura}"
        color="${corFolha}"
        position="-0.06 ${(altura*0.65).toFixed(2)} 0"
        rotation="0 20 0">
        </a-plane>

        <a-plane
        width="0.28"
        height="${folhaAltura}"
        color="${corFolha}"
        position="0.06 ${(altura*0.65).toFixed(2)} 0"
        rotation="0 -20 0">
        </a-plane>

        `;

        plantacao.appendChild(milho);

    }

}

</script>

<!--          LÓGICA DO TABLET / ALERTA                    -->
<!-- ===================================================== -->

<script>

const tela = document.querySelector("#telaTablet");
const painelAlerta = document.querySelector("#painelAlerta");
const fecharAlerta = document.querySelector("#fecharAlerta");

let alertaDisponivel = false;

// mesmo componente usado no cabine.html: mantém a janela sempre virada
// pra câmera, mesmo ficando parada num ponto fixo do mundo
AFRAME.registerComponent("seguir-camera", {
    tick: function () {
        const cam = document.querySelector("#camera").object3D;

const pos = cam.position.clone();

// mantém a janela reta
pos.y = this.el.object3D.position.y;

this.el.object3D.lookAt(pos);
    }
});

// Desenha o título + a mensagem do alerta num canvas (suporta acentos)
// e aplica como textura na placa #conteudoAlerta
function desenharConteudoAlerta(){
    const canvas = document.createElement('canvas');
    canvas.width = 1800;
    canvas.height = 1300;
    const ctx = canvas.getContext('2d');

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // faixa do título
    ctx.fillStyle = 'rgba(0,255,157,0.18)';
    ctx.fillRect(0, 0, canvas.width, 78);

    ctx.fillStyle = '#9dffd4';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = "700 74px Orbitron, Arial, sans-serif";
    ctx.fillText('ALERTA · ANÁLISE LEAK VISION', canvas.width / 2, 39);

    // corpo do texto, quebrando linha automaticamente
    const paragrafos = [
        "• Detectamos uma anomalia no rolamento da roda dianteira esquerda. A IA estima falha total em aproximadamente 3 horas caso a operação continue.",
        "• A equipe de manutenção foi acionada automaticamente. Tempo estimado de chegada: 30 minutos.",
        "Recomendação da IA – Leak Vision",
        "• Sua localização foi verificada em tempo real. Você está a 12 km da base. Recomendamos desligar a máquina em um local seguro e aguardar a equipe de manutenção.",
    ];

    ctx.fillStyle = '#eafff2';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = "600 54px Rajdhani, Arial, sans-serif";

    const margem = 55;
    const larguraMaxima = canvas.width - margem * 2;
    const alturaLinha = 80;
    let y = 212;

    paragrafos.forEach(paragrafo => {
        const palavras = paragrafo.split(' ');
        let linha = '';

        palavras.forEach(palavra => {
            const teste = linha ? linha + ' ' + palavra : palavra;

            if (ctx.measureText(teste).width > larguraMaxima) {
                ctx.fillText(linha, margem, y);
                linha = palavra;
                y += alturaLinha;
            } else {
                linha = teste;
            }
        });

        ctx.fillText(linha, margem, y);
        y += alturaLinha * 1.5;
    });

    const plano = document.querySelector('#conteudoAlerta');
    plano.setAttribute('material', 'src', canvas.toDataURL());
}

if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(desenharConteudoAlerta);
} else {
    desenharConteudoAlerta();
}

// depois de um tempo dirigindo normalmente, o tablet acende (nova análise)
setTimeout(()=>{

    alertaDisponivel = true;

    tela.setAttribute(
        "material",
        "color:#00160e; emissive:#00ff9d; emissiveIntensity:0.9; shader:standard"
    );

    tela.setAttribute("animation__piscar", {
        property: "material.emissiveIntensity",
        dir: "alternate",
        loop: true,
        dur: 700,
        to: 0.35
    });

},9000);

tela.addEventListener("click", ()=>{

    if(!alertaDisponivel) return;

    const abrindo = painelAlerta.getAttribute("visible") !== true;

    if(abrindo){

        painelAlerta.setAttribute("visible", true);
        painelAlerta.emit("aparecer");

        // primeira vez que abre: tela para de piscar e fica em verde fixo
        // (como um "lido")
        tela.removeAttribute("animation__piscar");
        tela.setAttribute(
            "material",
            "color:#00160e; emissive:#00ff9d; emissiveIntensity:0.35; shader:standard"
        );

    } else {

        painelAlerta.setAttribute("visible", false);

    }

});

fecharAlerta.addEventListener("click", ()=>{

    painelAlerta.setAttribute("visible", false);

});

</script>

<script>

(function aplicarCeuGradiente(){
    const canvas = document.createElement('canvas');
    canvas.width = 2;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#3f7fd1');
    grad.addColorStop(0.55, '#8fc6e8');
    grad.addColorStop(0.82, '#e7f3ec');
    grad.addColorStop(1, '#f4ecd8');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 2, 512);

    const ceu = document.querySelector('#ceu');
    ceu.setAttribute('material', 'shader', 'flat');
    ceu.setAttribute('material', 'src', canvas.toDataURL());
})();

(function aplicarTexturaGrama(){
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#7b8c42';
    ctx.fillRect(0, 0, 256, 256);

    for (let i = 0; i < 900; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        ctx.fillStyle = Math.random() < 0.5
            ? 'rgba(60,90,30,0.22)'
            : 'rgba(160,180,95,0.18)';
        ctx.fillRect(x, y, 2, 2);
    }

    const chao = document.querySelector('#chaoGrama');
    chao.setAttribute('material', 'src', canvas.toDataURL());
    chao.setAttribute('material', 'repeat', '40 40');
})();
