<a-entity id="plantacao"></a-entity>

<script>

const plantacao = document.querySelector("#plantacao");

const tonsTalo = ["#5d8b32", "#6b9a3c", "#548029"];
const tonsFolha = ["#6ea83f", "#7fbd4a", "#63a038"];

/* gera centenas de pés de milho, com variação orgânica de altura e cor */
for(let z=-80;z<80;z+=3){

    for(let x=-18;x<18;x+=3){

        // deixa livre a estrada
        if(Math.abs(x)<4) continue;

        const milho=document.createElement("a-entity");

        milho.setAttribute("position",
        `${x+(Math.random()*0.5)} 0 ${z}`);

        const altura = 1.0 + Math.random()*0.45;
        const folhaAltura = 0.8 + Math.random()*0.35;
        const corTalo = tonsTalo[Math.floor(Math.random()*tonsTalo.length)];
        const corFolha = tonsFolha[Math.floor(Math.random()*tonsFolha.length)];

        milho.innerHTML=`

        <a-cylinder
        radius="0.02"
        height="${altura}"
        color="${corTalo}"
        position="0 ${(altura/2).toFixed(2)} 0">
        </a-cylinder>

        <a-plane
        width="0.28"
        height="${folhaAltura}"
        color="${corFolha}"
        position="-0.06 ${(altura*0.65).toFixed(2)} 0"
        rotation="0 20 0">
        </a-plane>

        <a-plane
        width="0.28"
        height="${folhaAltura}"
        color="${corFolha}"
        position="0.06 ${(altura*0.65).toFixed(2)} 0"
        rotation="0 -20 0">
        </a-plane>

        `;

        plantacao.appendChild(milho);

    }

}

</script>

<script>

/* sensação de cabine andando */

const camera=document.querySelector("#camera");

let tempo=0;

function moverCabine(){

tempo+=0.06;

camera.object3D.position.y=
1.65+
Math.sin(tempo)*0.015;

camera.object3D.rotation.z=
Math.sin(tempo)*0.002;

requestAnimationFrame(moverCabine);

}

moverCabine();

</script>

<script>

const todasPlantas=
document.querySelectorAll("#plantacao a-entity");

let maquinaLigada = true;

function moverMundo(){

if(maquinaLigada){

    todasPlantas.forEach(planta=>{

        let p=planta.object3D.position;

        p.z+=0.18;

        if(p.z>8){

            p.z=-80;

}

<!--                 FUMAÇA                                -->
<!-- ===================================================== -->

<a-entity
    id="fumaca"
    position="-1.22 0.62 -1.18">
</a-entity>

<script>

const fumaca=document.querySelector("#fumaca");

function criarFumaca(){

    for(let i=0;i<10;i++){

        const p=document.createElement("a-sphere");

        const raioBase = 0.05+Math.random()*0.08;

        p.setAttribute("radius",raioBase);

        p.setAttribute(
        "material",
        "color:#8a8a8a; shader:flat; opacity:0.5");

        p.setAttribute(
"position",
"0 0 0"
);

        fumaca.appendChild(p);

        subirFumaca(p, raioBase, i*80);

    }

}

function subirFumaca(particula, raioBase, delay){

    setTimeout(()=>{

        let x = 0;
        let y = 0;
        let z = 0;

        let op = 0.45;

        const derivaX = (Math.random()-0.5)*0.01;
        const derivaZ = (Math.random()-0.5)*0.01;

        const intervalo = setInterval(()=>{

            y += 0.028;

            x += derivaX;

            z += derivaZ;

            op -= 0.009;

            const raio = raioBase + y*0.12;

            particula.setAttribute(
                "position",
                `${x} ${y} ${z}`
            );

            particula.setAttribute(
                "radius",
                raio
            );

            particula.setAttribute(
                "material",
                `color:#8a8a8a; shader:flat; opacity:${Math.max(op,0)}`
            );

            if(op <= 0){

                clearInterval(intervalo);

                particula.remove();

            }

        },50);

    },delay);

}

</script>

<!-- ===================================================== -->
<!--               FALHA DA MÁQUINA                        -->
<!-- ===================================================== -->

<audio

id="falha"

src="static/audio/falha.mp3">

</audio>

<script>

let velocidadeAtual=12;

let rpmAtual=1850;

const velTexto=document.querySelector("#velocidade");

const rpmTexto=document.querySelector("#rpm");

const motor=document.querySelector("#motorSom");

const colheita=document.querySelector("#colheitaSom");

const btn=document.querySelector("#btnLeak");

AFRAME.registerComponent("seguir-camera", {
    tick: function () {

        const camera = document.querySelector("#camera").object3D;

        this.el.object3D.lookAt(camera.position);

    }
});

setTimeout(()=>{

/* cancela a leitura normal antes de começar a sequência de falha */
clearInterval(intervaloLeituraNormal);

const audio=document.getElementById("falha");

audio.play().catch(()=>{});

/* tremor mexe só em rotation.x, não briga com o moverCabine() */
camera.setAttribute("animation__tremer",{

property:"rotation.x",

to:-1.2,

dir:"alternate",

dur:70,

loop:true

});

let queda=setInterval(()=>{

velocidadeAtual-=0.4;

rpmAtual-=70;

if(velocidadeAtual<0){

velocidadeAtual=0;

}

if(rpmAtual<0){

rpmAtual=0;

}

velTexto.setAttribute(

"value",

velocidadeAtual.toFixed(0)+" km/h"

);

rpmTexto.setAttribute(

"value",

"RPM "+rpmAtual.toFixed(0)

);

if(velocidadeAtual <= 0){

    clearInterval(queda);

    // A máquina para completamente
    maquinaLigada = false;

    if(motor.components.sound){
        motor.components.sound.stopSound();
    }

    if(colheita.components.sound){
        colheita.components.sound.stopSound();
    }

    camera.removeAttribute("animation__tremer");
    camera.object3D.rotation.x = 0;

    let intervaloFumaca;

    function iniciarFumaca(){

        criarFumaca();

        intervaloFumaca = setInterval(()=>{

            criarFumaca();

        },1400);

    }

    // INICIA A FUMAÇA
    iniciarFumaca();

    // MOSTRA A JANELA DO LEAK VISION (com animação de entrada)
    btn.setAttribute("visible", true);
    btn.emit("aparecer");

}

},220);

},14000);

</script>

<!-- ===================================================== -->

<script>

// Céu em gradiente (em vez de cor chapada)
(function aplicarCeuGradiente(){
    const canvas = document.createElement('canvas');
    canvas.width = 2;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#3f7fd1');
    grad.addColorStop(0.55, '#8fc6e8');
    grad.addColorStop(0.82, '#e7f3ec');
    grad.addColorStop(1, '#f4ecd8');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 2, 512);

    const ceu = document.querySelector('#ceu');
    ceu.setAttribute('material', 'shader', 'flat');
    ceu.setAttribute('material', 'src', canvas.toDataURL());
})();

// Grama com variação orgânica (em vez de verde chapado)
(function aplicarTexturaGrama(){
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#7b8c42';
    ctx.fillRect(0, 0, 256, 256);

    for (let i = 0; i < 900; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        ctx.fillStyle = Math.random() < 0.5
            ? 'rgba(60,90,30,0.22)'
            : 'rgba(160,180,95,0.18)';
        ctx.fillRect(x, y, 2, 2);
    }

    const chao = document.querySelector('#chaoGrama');
    chao.setAttribute('material', 'src', canvas.toDataURL());
    chao.setAttribute('material', 'repeat', '40 40');
})();

// Trilha de mato/grama amassada (em vez de asfalto) — a "estrada" agora
// é só uma faixa de vegetação mais baixa/clara, sem aparência de rua
(function aplicarTexturaEstrada(){
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    // base verde, um pouco mais clara/amarelada que o campo ao redor
    // (como se o mato tivesse sido amassado pela passagem da máquina)
    ctx.fillStyle = '#7c9a49';
    ctx.fillRect(0, 0, 128, 512);

    for (let i = 0; i < 1400; i++) {
        const x = Math.random() * 128;
        const y = Math.random() * 512;
        ctx.fillStyle = Math.random() < 0.5
            ? 'rgba(60,90,30,0.25)'
            : 'rgba(190,205,120,0.22)';
        ctx.fillRect(x, y, 2, 2);
    }

    // trilhos bem sutis das rodas, ainda verdes, só um pouco mais escuros
    ctx.fillStyle = 'rgba(70,95,40,0.35)';
    ctx.fillRect(18, 0, 14, 512);
    ctx.fillRect(96, 0, 14, 512);

    const estrada = document.querySelector('#estrada');
    estrada.setAttribute('material', 'src', canvas.toDataURL());
    estrada.setAttribute('material', 'repeat', '2 60');
})();

</script>
